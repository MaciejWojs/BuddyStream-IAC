apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  description: Shared platform services (Vault, CloudNativePG clusters)
  sourceRepos:
    - https://github.com/MaciejWojs/BuddyStream-IAC.git
    - https://helm.releases.hashicorp.com
  destinations:
    - namespace: vault
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
