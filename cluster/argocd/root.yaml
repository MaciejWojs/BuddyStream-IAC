apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: buddy-stream
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://github.com/MaciejWojs/BuddyStream-IAC.git
      targetRevision: HEAD
      path: cluster/argocd/projects
      directory:
        recurse: true
    - repoURL: https://github.com/MaciejWojs/BuddyStream-IAC.git
      targetRevision: HEAD
      path: cluster/argocd/apps
      directory:
        recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      enabled: true
      prune: true
      selfHeal: true
