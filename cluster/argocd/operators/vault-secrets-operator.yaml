apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: operators
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault-secrets-operator
      targetRevision: 2.0.0
      helm:
        releaseName: vault-secrets-operator
        valueFiles:
          - $values/cluster/operators/vault-secrets-operator/values.yaml
    - repoURL: https://github.com/MaciejWojs/BuddyStream-IAC.git
      targetRevision: HEAD
      path: cluster/operators/vault-secrets-operator
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-secrets-operator
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      refresh: true
    automated:
      enabled: true
      prune: true
      selfHeal: true
