apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  project: vault
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault
      targetRevision: 0.34.1
      helm:
        valueFiles:
          - $values/cluster/vault/values.yaml
    - repoURL: https://github.com/MaciejWojs/BuddyStream-IAC.git
      targetRevision: HEAD
      path: cluster/vault
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    retry:
      refresh: true
    automated:
      enabled: true
      prune: true
      selfHeal: true
