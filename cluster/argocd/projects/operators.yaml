apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: operators
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  description: Operatory klastra (kontrolery i CRD)
  sourceRepos:
    - https://github.com/MaciejWojs/BuddyStream-IAC.git
    - https://helm.releases.hashicorp.com
    - https://cloudnative-pg.github.io/charts
  destinations:
    - namespace: operators
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
