apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: backend
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: backend
    serviceAccount: backend-sa
    audiences:
      - vault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-sa
      containers:
        - name: backend
          image: ghcr.io/maciejwojs/buddy-stream-backend:0.0.3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: backend-secrets
spec:
  vaultAuthRef: backend
  type: kv-v2
  mount: secret
  path: backend
  refreshAfter: 30s
  destination:
    name: backend-secrets
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: backend-deployment
