apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: platform
  source:
    repoURL: https://github.com/MaciejWojs/BuddyStream-IAC.git
    targetRevision: HEAD
    path: cluster/platform/database
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    retry:
      refresh: true
    automated:
      enabled: true
      prune: true
      selfHeal: true
